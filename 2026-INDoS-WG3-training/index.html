If someone asks you to imagine an apple, you know what an apple is, but you don't see it in
your head.

So no, we are not all built the same way, and that's great! It means we all read differently,
with different perspectives and different biases. And comparing them is exciting: that's how we
explore and learn.

That's why the idea of our following activity will be to leverage this variety of views, with the
aim of building federated reviews of articles: reviews built by combining everyone's readings.

# Three ways in

.cards.cols-3[
.card[
### Read in passes
Triage first: title, abstract, figures, conclusions. Then read properly. Then read as if you
had to re-run the study.
]
.card[
### Read methods as a pipeline
For each step: what it does, what it assumes, which parameters were chosen or left at default.
]
.card[
### Question the figures
What is plotted, with what sample size? Does it support the claim in the text, or a weaker one?
]
]

Three approaches from the Journal Club's guide, written by the organizers. Take whichever speaks
to you.

First, read in passes rather than top to bottom. Srinivasan Keshav's three-pass method: a quick
triage (title, abstract, figures, conclusions), then a proper read where you note what you don't
understand, then a last pass where you imagine re-running the study yourself.

Second, since most papers in the pool are about preprocessing, read the methods like a pipeline:
for each step, what it does, what it assumes, and which parameters were chosen deliberately
versus left at default.

Third, question the figures, which is the idea behind the CREATE method: what is actually
plotted, with how many subjects, and does it support the claim in the text, or only a weaker
version of it?

And if you find Methods and Results the hardest part: a survey of 260 students and researchers
found exactly that for less experienced readers. It is a skill that grows with practice, which is
what today is for. The full guide is at the link.
